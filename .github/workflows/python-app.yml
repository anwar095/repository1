name: Python Flask CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest

    - name: Deploy app locally (for demo)
      run: |
        echo "Deploying app to local folder"
        mkdir -p $HOME/deploy_app
        cp -r . $HOME/deploy_app
    - name: Run Flask app (demo)
      run: python app.py 
